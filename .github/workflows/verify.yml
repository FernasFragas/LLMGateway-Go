# Path in repo: .github/workflows/verify.yml
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the version from go.mod rather than pinning it here. The pin had
      # drifted to 1.22 against a `go 1.26.2` module and only worked because
      # GOTOOLCHAIN=auto silently downloaded the real toolchain on every run —
      # so CI was neither testing the pinned version nor failing about it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Spec is a fixture: built-in OAS rules + gateway-* contract invariants.
      - name: Lint OpenAPI contract
        run: make lint-spec

      # config.example.yaml is a fixture: parsed and validated by the tests.
      - name: Unit tests
        run: make test

      # The quota store against a real redis:7-alpine. testcontainers starts
      # it from inside the test binary, so no `services:` block is needed —
      # ubuntu-latest already has a Docker daemon.
      - name: Integration tests (real Redis)
        run: make test-integration

      # The evaluation runner and the stub provider are code too. No network,
      # no model: ubuntu-latest's python3 and the standard library only.
      - name: Evaluation harness tests
        run: make test-evals

      - name: Build
        run: make build

  # The whole request chain on a throwaway kind cluster, with a stub provider
  # standing in for a model: token → auth → route → provider key → adapter →
  # scoring. No real key, no cost, the same result every run. Runs in parallel
  # with verify; the script itself is deploy/ci/e2e.sh, so it runs locally too.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Creates the cluster and points kubectl at it (context kind-llm-e2e),
      # which is the only kind of context e2e.sh agrees to run against.
      - uses: helm/kind-action@v1
        with:
          cluster_name: llm-e2e

      - name: End-to-end evaluation against a stub provider
        run: make e2e

      - name: Keep the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: evals/results/e2e.json
          if-no-files-found: ignore
