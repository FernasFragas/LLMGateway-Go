# The in-cluster config.yaml, mounted read-only at /etc/gateway/config.yaml by
# the Deployment. A ConfigMap because config must change without an image
# rebuild — the schema lives in config.example.yaml (the tested fixture); this
# is that schema with in-cluster hostnames filled in.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: llm
data:
  config.yaml: |
    server:
      listen: ":8080"
      max_body_bytes: 524288          # 512 KB — enforced with 413
      global_max_in_flight: 800       # protects process memory
      total_deadline: 30s             # default per-request budget (apps may override)
      per_try_deadline: 10s           # per provider attempt; must be < total_deadline
      # WriteTimeout must exceed the largest app total_deadline, or the server
      # kills completions the core still considers within budget. agent-service
      # below runs to 150s, so the api default (90s) is too short here.
      write_timeout: 160s

    # Caller identity: bound ServiceAccount tokens verified locally against the
    # cluster JWKS (fail static — no TokenReview on the request path).
    #
    # issuer below is DOCKER DESKTOP'S. Every managed cluster issues tokens
    # under an OIDC URL instead, and the claim is matched exactly — so on
    # EKS/GKE/AKS this value refuses every caller. Read the real one with:
    #
    #   kubectl get --raw /.well-known/openid-configuration | jq -r .issuer
    #
    # The gateway now checks this at startup against that same document and
    # refuses to boot on a mismatch, naming both values. jwks_url does NOT
    # need to match the jwks_uri that document advertises: it points at the
    # apiserver's own address, while this is the in-cluster service path, and
    # them differing is the normal setup.
    auth:
      issuer: https://kubernetes.default.svc.cluster.local
      audience: llm-gateway
      jwks_url: https://kubernetes.default.svc/openid/v1/jwks
      refresh_interval: 5m

    # Routes registry: which endpoint serves which model — transport facts only.
    routes:
      - model: gpt-4.1
        provider: openai
        endpoint: https://api.openai.com/v1
      - model: claude-sonnet-4
        provider: anthropic
        endpoint: https://api.anthropic.com/v1
      - model: llama3
        provider: ollama
        endpoint: http://ollama.llm.svc.cluster.local:11434

    failover_order: [openai, anthropic, ollama]

    apps:
      rag-api:
        subject: system:serviceaccount:llm:rag-api
        limits:
          rps: 60
          tokens_per_minute: 200000
          max_in_flight: 600          # <= global_max_in_flight
        failover_policy: any

      agent-service:
        subject: system:serviceaccount:llm:agent-service
        total_deadline: 150s          # long tool-calling runs need a bigger budget
        limits:
          rps: 5
          tokens_per_minute: 500000
          max_in_flight: 300
        failover_policy: same-model   # no substitutes, ever — its recorded trade

      support-bot:
        subject: system:serviceaccount:llm:support-bot
        limits:
          rps: 10
          tokens_per_minute: 50000
          max_in_flight: 50
        failover_policy:
          allowlist: [gpt-4.1, claude-sonnet-4]   # every entry must exist in routes

    # The quota store both rate currencies share — quotas + breaker state
    # only, never a credential. `deploy/` ships no Redis: it is external
    # infrastructure, and this key is the whole integration (see
    # deploy/README.md). The address below is the one deploy/dev/redis.yaml
    # creates; managed Redis means changing this line and nothing else.
    # Unreachable is survivable — limits go unenforced, requests keep flowing,
    # and both limiters say so in the log.
    #
    # tls and password_path are absent because this address is an in-cluster
    # Redis on the pod network. A managed cache needs them — mount the CA and
    # the password as files (never values here; this ConfigMap is in git) and
    # set all three keys together.
    redis:
      addr: redis.llm.svc.cluster.local:6379
      # tls: true
      # ca_path: /etc/gateway/redis/ca.pem
      # password_path: /etc/gateway/redis/password

    # Provider keys only — app identity is the SA token. One source per
    # provider; ollama is absent because the in-cluster route needs no
    # credential.
    secret_source:
      kind: file
      refresh_interval: 5m             # default cadence; entries may override
      providers:
        openai:
          path: /etc/gateway/keys/openai
        anthropic:
          path: /etc/gateway/keys/anthropic

    # Metrics, traces, and logs all leave over this one OTLP endpoint
    # (ADR-002) — there is no scrape port to open or annotate.
    telemetry:
      otlp_endpoint: otel-collector.observability.svc.cluster.local:4317
