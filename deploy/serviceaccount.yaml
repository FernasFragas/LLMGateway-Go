# The pod's own identity. Kubernetes mounts this SA's projected token and the
# cluster CA into the pod at /var/run/secrets/kubernetes.io/serviceaccount/ —
# the exact files the step-4 JWKS fetch client reads to trust and authenticate
# against the API server. No SA, no identity, no fix.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway
  namespace: llm
