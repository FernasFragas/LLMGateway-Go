# LLMGateway-Go — example configuration.
# This file is a TEST FIXTURE: internal/config/config_test.go parses and
# validates it in CI, so it cannot drift from the schema. Copy to config.yaml.

server:
  listen: ":8080"
  max_body_bytes: 524288          # 512 KB — enforced with 413
  global_max_in_flight: 800       # protects process memory (see brief: scale targets)
  total_deadline: 30s             # default per-request budget (apps may override)
  per_try_deadline: 10s           # per provider attempt; must be < total_deadline

# Caller identity: bound ServiceAccount tokens, verified locally against the
# cluster's JWKS (fail static — no TokenReview on the request path). Each
# app below names its subject; the kubelet projects the matching token:
#   serviceAccountToken: { audience: llm-gateway, path: token }
auth:
  issuer: https://kubernetes.default.svc.cluster.local   # kubectl get --raw /.well-known/openid-configuration | jq .issuer
  audience: llm-gateway
  jwks_url: https://kubernetes.default.svc/openid/v1/jwks
  refresh_interval: 5m            # failed refresh keeps serving cached keys; rotation lands within one interval

# Routes registry: which endpoint serves which model — transport facts only.
# The gateway never declares two models interchangeable (see non-goals).
routes:
  - model: gpt-4.1
    provider: openai
    endpoint: https://api.openai.com/v1
  - model: claude-sonnet-4
    provider: anthropic
    endpoint: https://api.anthropic.com/v1
  - model: llama3
    provider: ollama
    endpoint: http://ollama.llm.svc.cluster.local:11434

# Order tried when a policy permits leaving the requested model's route.
failover_order: [openai, anthropic, ollama]

# Per-app contract. Each app declares THREE limits (rate, tokens, slots)
# and ONE failover policy. Policy forms:
#   failover_policy: any                          — delegate to failover_order
#   failover_policy: same-model                   — route failover only (default)
#   failover_policy: { allowlist: [m1, m2] }      — app-named substitutes, in order
apps:
  rag-api:
    subject: system:serviceaccount:llm:rag-api
    limits:
      rps: 60
      tokens_per_minute: 200000
      max_in_flight: 600          # slot ceiling — must be <= global_max_in_flight
    failover_policy: any

  agent-service:
    subject: system:serviceaccount:llm:agent-service
    total_deadline: 150s          # long tool-calling runs (30-120 s) need a bigger budget
    limits:
      rps: 5
      tokens_per_minute: 500000
      max_in_flight: 300
    failover_policy: same-model   # no substitutes, ever — its recorded trade

  support-bot:
    subject: system:serviceaccount:llm:support-bot
    limits:
      rps: 10
      tokens_per_minute: 50000
      max_in_flight: 50
    failover_policy:
      allowlist: [gpt-4.1, claude-sonnet-4]   # every entry must exist in routes

redis:
  addr: redis.llm.svc.cluster.local:6379      # quotas + breaker state only (fail open)

# Provider keys — outbound credentials only; app identity is the ServiceAccount
# token and needs nothing here. One source per provider, each on its own cadence:
# a shared source could only be scheduled once, which would make every interval
# but the shortest decorative (ADR-001). A provider absent from `providers` has
# no credential and its adapter sends no auth header — that is how the
# in-cluster Ollama route is declared, not an oversight.
secret_source:
  kind: vault                      # or: file — then each path is a file path
  refresh_interval: 5m             # default cadence; entries below may override

  # Kubernetes auth: the gateway trades its own projected ServiceAccount token
  # for a Vault token, so no credential has to be distributed to read
  # credentials. The Vault token leases and is renewed on its own schedule,
  # independent of the per-provider cadences below.
  vault:
    address: https://vault.vault.svc.cluster.local:8200
    role: llm-gateway              # Vault role bound to this pod's ServiceAccount
    auth_path: auth/kubernetes     # mount point of the Kubernetes auth method

  # Paths are literal read paths, `data/` included for a KV v2 mount — a wrong
  # mount version fails as a visible 404 rather than a silent client rewrite.
  # The key itself lives under the field `key`, by convention, in every secret.
  providers:
    openai:
      path: secret/data/llm/openai
      refresh_interval: 1m         # rotates hourly upstream — chase it
    anthropic:
      path: secret/data/llm/anthropic     # inherits the 5m default
    # ollama: absent on purpose — in-cluster and unauthenticated. Ollama Cloud
    # would be a second provider name (see ADR-001, question 6), with its own
    # entry here and its own route.

telemetry:
  otlp_endpoint: otel-collector.observability.svc.cluster.local:4317
  metrics_listen: ":9090"
